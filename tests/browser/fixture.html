<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdminLTE 4 shell fixture</title>
    <link rel="stylesheet" href="/vendor/laravel-admin/adminlte4/css/adminlte.min.css">
    <link rel="stylesheet" href="/vendor/laravel-admin/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/vendor/laravel-admin/laravel-admin/laravel-admin.css">
    <link rel="stylesheet" href="/vendor/laravel-admin/laravel-admin/themes.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary" data-admin-theme="blue" data-bs-theme="light">
<div class="app-wrapper">
    <nav class="app-header navbar navbar-expand navbar-static-top">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" id="sidebar-toggle" data-lte-toggle="sidebar" href="#" role="button" aria-label="Toggle navigation">
                        <i class="fa fa-bars" aria-hidden="true"></i>
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto navbar-custom-menu">
                <li class="nav-item dropdown user-menu">
                    <a href="#" class="nav-link dropdown-toggle" id="user-menu" data-bs-toggle="dropdown" aria-expanded="false">
                        <span>Admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a href="#" class="dropdown-item">Setting</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <aside class="app-sidebar">
        <div class="sidebar-brand">
            <a href="#" class="brand-link"><span class="brand-text fw-light">Laravel Admin</span></a>
        </div>
        <div class="sidebar-wrapper">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu" data-accordion="false">
                <li class="nav-item">
                    <a href="#" class="nav-link active"><i class="nav-icon fa fa-dashboard"></i><p><span>Dashboard</span></p></a>
                </li>
                <li class="nav-item" id="tree-parent">
                    <a href="#" class="nav-link">
                        <i class="nav-icon fa fa-users"></i>
                        <p><span>Users</span><i class="nav-arrow fa fa-angle-right"></i></p>
                    </a>
                    <ul class="nav nav-treeview">
                        <li class="nav-item"><a href="#" class="nav-link"><p><span>All users</span></p></a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </aside>

    <main class="app-main" id="admin-content">
        <div class="app-content-header">
            <div class="container-fluid"><h3 class="mb-0">Dashboard</h3></div>
        </div>
        <div class="app-content">
            <div class="container-fluid">
                <div class="card card-primary" id="test-card">
                    <div class="card-header d-flex align-items-center">
                        <h3 class="card-title mb-0">Card</h3>
                        <div class="card-tools ms-auto">
                            <button type="button" class="btn btn-tool" id="card-collapse" data-lte-toggle="card-collapse" aria-label="Collapse">
                                <i class="fa fa-minus" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">Card body</div>
                </div>

                <div class="d-flex gap-2 my-3">
                    <button type="button" class="btn btn-primary" id="open-modal" data-bs-toggle="modal" data-bs-target="#test-modal">Open modal</button>
                    <div class="dropdown">
                        <button class="btn btn-outline-secondary" type="button" id="dropdown-button" data-bs-toggle="dropdown" aria-expanded="false">Dropdown</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Item</a></li>
                        </ul>
                    </div>
                </div>

                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link active" id="tab-one" data-bs-toggle="tab" href="#pane-one" role="tab" aria-selected="true">One</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" id="tab-two" data-bs-toggle="tab" href="#pane-two" role="tab" aria-selected="false">Two</a>
                    </li>
                </ul>
                <div class="tab-content pt-3">
                    <div class="tab-pane fade show active" id="pane-one" role="tabpanel">Pane one</div>
                    <div class="tab-pane fade" id="pane-two" role="tabpanel">Pane two</div>
                </div>

                <div class="modal fade" id="test-modal" tabindex="-1" aria-labelledby="test-modal-label" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="test-modal-label">Modal</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">Hello</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="app-footer">Footer</footer>
</div>

<script src="/vendor/laravel-admin/jquery/jquery-3.7.1.min.js"></script>
<script src="/vendor/laravel-admin/bootstrap5/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/laravel-admin/adminlte4/js/adminlte.min.js"></script>
<script src="/vendor/laravel-admin/laravel-admin/admin-ui.js"></script>
</body>
</html>
