name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^10.0'
          - php: '8.3'
            laravel: '^10.0'
          - php: '8.2'
            laravel: '^11.0'
          - php: '8.3'
            laravel: '^12.0'
          - php: '8.3'
            laravel: '^13.0'
          - php: '8.4'
            laravel: '^13.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Check frontend assets and manifest
        run: composer check-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend regression tests
        run: |
          npm ci --ignore-scripts
          npm test

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, fileinfo, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend and Playwright
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          PLAYWRIGHT_USE_BUNDLED: '1'
        run: npm run test:browser
